<meta name="apple-mobile-web-app-capable" content="yes">

<title>APEX RACING · Garaža</title>

<body>
<!-- The garage: opened from the menu's "Tvoj avto" card (joined with the menu later). The car on the turntable in the workshop above,
     its upgrades, service and paint below; each change plays its animation on the car. -->
<div id="g-app">
  <div id="g-demo" class="g-demo">
    <span class="g-demo-l">MOCKUP</span>
    <small class="g-ver" id="g-ver" hidden></small>
    <div class="g-modes" id="g-modes"><button data-mode="game">Kariera</button><button data-mode="free">Brezplačno</button><button data-mode="full">Polna igra</button><button data-mode="vet">Veteran</button></div>
    <button class="g-ico" data-act="reset" aria-label="Ponastavi"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M4 3.5v5h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="g-ico g-lang" data-act="lang" id="g-lang">EN</button>
    <button class="g-ico" data-act="demo-off" aria-label="Skrij"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>

  <!-- the workshop over the whole screen (the picture raised a little: Garage3D.shift), the page's buttons over it: Izberi progo and the
       coins at the top; the cars before and after it (their names in them; the car's own name only for the ear), back and Izberi at the bottom; a tapped part's menu (g-menu) -->
  <div class="g-stage" id="g-stage">
    <canvas id="g-gl"></canvas>
    <div class="g-vig"></div>
    <div class="g-chip" id="g-chip"></div>
    <div class="g-steps" id="g-steps"><span class="d"></span><b class="l"></b><button class="sk" data-act="skip">PRESKOČI ›</button></div>   <!-- (a show's steps as they run: the done ones as dots; PRESKOČI: to its end at once) -->
    <div class="g-load" id="g-load"><div class="g-spin"></div><p>Odpiram garažo …</p></div>
  </div>

  <header class="g-head">
    <button class="g-track" data-act="track" id="g-track">Izberi progo</button>
    <button class="g-cr" id="g-cr" data-act="coins" aria-label="Kovanci"><i class="g-coin"></i><b id="g-money">0</b></button>
  </header>
  <button class="g-snd" id="g-snd" data-act="sound" aria-label="Zvok"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="g-snd-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="g-snd-off" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

  <div class="g-low" id="g-low">
    <div class="g-namerow"><h2 id="g-name">PICO TURBO</h2><small id="g-sub"></small></div>
    <div class="g-cars2">
      <button class="g-cb prev" data-act="prev" id="g-prev" aria-label="Prejšnji avto"><b>«</b><span class="th"></span><i class="nm"></i></button>
      <button class="g-cb next" data-act="next" id="g-next" aria-label="Naslednji avto"><i class="nm"></i><span class="th"></span><b>»</b></button>
    </div>
    <footer class="g-foot">
      <button class="g-btn g-btn-back" data-act="back" aria-label="Nazaj"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="g-btn g-btn-rent" id="g-rent" data-act="rent" hidden>Najemi</button>
      <button class="g-btn g-btn-go" id="g-go" data-act="go">Izberi</button>
    </footer>
  </div>
  <div class="g-menu" id="g-menu" aria-live="polite"></div>
  <div class="g-guide" id="g-guide"></div>
  <div class="g-toast" id="g-toast"></div>
</div>
