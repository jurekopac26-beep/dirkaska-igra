<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>APEX Racing Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400..900;1,400..900&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="mockbar" role="toolbar" aria-label="Mockup state">
    <span class="mk">MOCKUP</span>
    <div class="seg3" id="states"></div>
    <button class="hide" id="mock-reset" aria-label="Reset the progress of this state" title="Reset progress"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M4 3.5v4.2h4.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="hide" id="mock-hide" aria-label="Hide the mockup bar">×</button>
  </div>
  <div id="device"><div id="app"></div></div>
</div>
<button id="mockdot" hidden aria-label="Show the mockup bar">M</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script>
<script src="outlines.js"></script>
<script src="routes.js"></script>
<script src="car3d.js"></script>
<script src="app.js"></script>
</body>
</html>
