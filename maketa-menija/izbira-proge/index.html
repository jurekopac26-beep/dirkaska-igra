<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izbira proge</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
:root { color-scheme: dark; --gold: #ffc629; --gold-hi: #ffe07a; --gold-lo: #f0ad0c; --gold-sh: #9a7300; --lbl: #9fb3d6; --lav: #aeb5f7; --curb-hi: #ff5145; --curb-lo: #c9191a; --curb-sh: #8c1212;
  --steel1: #666d7b; --steel2: #3b414d; --steel-sh: #1f232b; --f-ui: 'ApexMenu', Roboto, Arial, sans-serif; }
* { box-sizing: border-box; }
canvas { pointer-events: none; }
html { background: #0b1424; }
html, body { margin: 0; width: 412px; height: 892px; overflow: hidden; background: #0b1424; font-family: var(--f-ui); color: #fff; }
.abs { position: absolute; }
/* the header: back, the track's facts, the flag */
.head { left: 0; right: 0; top: 0; height: 74px; background: linear-gradient(180deg, #13213a, #0d1829); display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.sq { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 11px; background: linear-gradient(180deg, var(--steel1), var(--steel2)); border: 1.5px solid rgba(255,255,255,.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 var(--steel-sh); display: flex; align-items: center; justify-content: center; }
.sq svg { width: 26px; height: 26px; }
.hstats { flex: 1 1 auto; min-width: 0; display: flex; }
.hstats > div { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px; border-left: 1px solid rgba(255,255,255,.12); }
.hstats > div:first-child { border-left: 0; }
.hstats small { font: 600 11.5px/1 var(--f-ui); color: var(--lbl); } .hstats b { font: 800 italic 17px/1 var(--f-ui); white-space: nowrap; }
.hstats > div:first-child small, .hstats > div:first-child b { color: var(--gold); }
.hflag { flex: 0 0 auto; width: 52px; height: 34px; border-radius: 3px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.hflag svg { width: 100%; height: 100%; display: block; }
/* the map */
.map { left: 0; right: 0; top: 74px; height: 370px; overflow: hidden; }
.map img { width: 100%; display: block; }
.map img.zoom { width: 110%; margin-left: -5%; margin-top: 0; }
.views { left: 10px; top: 10px; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(8,12,20,.82); border: 1.5px dashed rgba(255,198,41,.6); }
.views i { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 italic 15px/1 var(--f-ui); font-style: normal; color: #cfd8ea; }
.views i.on { background: var(--gold); color: #1b1b1b; }
.wx { right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; padding: 6px 5px; border-radius: 999px; background: rgba(8,12,20,.82); border: 1.5px dashed rgba(255,198,41,.6); }
.wx i { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.wx i.on { box-shadow: 0 0 10px rgba(255,198,41,.75), inset 0 0 8px rgba(255,198,41,.35); }
.wx svg { width: 24px; height: 24px; }
/* the menu under the map: a room (a wall, a floor) */
.room { left: 0; right: 0; top: 444px; bottom: 0; }
.row { left: 14px; right: 14px; top: 454px; height: 60px; border-radius: 13px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 8px; z-index: 2; }
.row canvas { width: 46px; height: 46px; }
.opp { display: flex; flex-direction: column; align-items: center; gap: 4px; border-left: 1px solid rgba(255,255,255,.12); padding-left: 16px; }
.rname { flex: 1 1 auto; text-align: center; font: 900 italic 30px/1 var(--f-ui); letter-spacing: -.3px; text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.mg { position: absolute; z-index: 2; pointer-events: none; overflow: visible; }
.mg .ln { fill: none; stroke: #ffd23a; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.mg .base { stroke: rgba(255,255,255,.55); stroke-width: 1; }
.mg .kt { stroke: rgba(255,255,255,.7); stroke-width: 1; }
.mg .gl { stroke: rgba(255,255,255,.45); stroke-width: 1; stroke-dasharray: 3 4; }
.mg text { font: 800 10px/1 var(--f-ui); fill: #fff; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: rgba(0,0,0,.7); stroke-width: 2.6px; stroke-linejoin: round; }
.mg text.hi, .mg text.lo { font: 800 italic 11px/1 var(--f-ui); }
.mg .halo { fill: rgba(255,210,58,.4); } .mg .pt circle + circle { fill: #fff; stroke: #ffd23a; stroke-width: 1.6; }
.opp small { font: 600 12px/1 var(--f-ui); color: var(--lbl); } .opp b { font: 900 italic 22px/1 var(--f-ui); }
/* the boards behind the car (as the garage's YOUR CAR / RENT A CAR boards) */
.bd { position: absolute; border: 2.5px solid #fff; border-radius: 5px; box-shadow: 0 0 0 1.5px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.28), 3px 4px 0 rgba(0,0,0,.35); color: #fff;
  font: 800 23px/1 var(--f-ui); display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 0 rgba(0,0,0,.35); filter: brightness(.86) saturate(.9); }
.bd.g { background: linear-gradient(180deg, #2fae50, #17803a); font-size: 19px; }
.bd.b { background: linear-gradient(180deg, #3576e6, #1c4db6); font-size: 36px; }
.post { position: absolute; width: 6px; border-radius: 2px; background: linear-gradient(90deg, #6f7888, #e3e7ee 45%, #7b8494); filter: brightness(.86); }
.car { z-index: 3; }
.fl { position: absolute; pointer-events: none; }
.fl.behind { z-index: 1; } #boards .bd, #boards .post { z-index: 2; } .fl.front { z-index: 5; } .fl.top { z-index: 4; }
.pole { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #6f7888, #eef1f5 45%, #7b8494); }
.knob { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc629 60%, #a87400); }
.fl canvas { position: absolute; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.3)); }
.flow { z-index: 4; pointer-events: none; }
.graph { z-index: 5; left: 0; width: 412px; pointer-events: none; }
/* the neighbours' flags, back and Race! */
.nb { position: absolute; top: 752px; width: 186px; height: 58px; border-radius: 13px; overflow: hidden; border: 1.5px solid rgba(255,255,255,.5); box-shadow: 0 4px 0 #0a1220, 0 8px 18px rgba(0,0,0,.45); z-index: 6; }
.nb svg.f { position: absolute; inset: 0; width: 100%; height: 100%; }
.nb svg.ar { position: absolute; top: 14px; width: 38px; height: 30px; filter: drop-shadow(0 0 1.5px #000) drop-shadow(0 2px 3px rgba(0,0,0,.9)); }
.nb svg.ar path { fill: none; stroke: #fff; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.back { left: 14px; top: 824px; width: 78px; height: 56px; border-radius: 12px; background: linear-gradient(180deg, var(--steel1), var(--steel2)); border: 1.5px solid rgba(255,255,255,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 var(--steel-sh); display: flex; align-items: center; justify-content: center; z-index: 6; }
.go { left: 102px; right: 14px; top: 824px; height: 56px; border-radius: 13px; background: linear-gradient(180deg, var(--curb-hi), #e0231f 55%, var(--curb-lo)); border: 1px solid rgba(255,140,120,.55);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 5px 0 var(--curb-sh), 0 12px 26px rgba(224,35,31,.3); display: flex; align-items: center; justify-content: center; font: 900 italic 28px/1 var(--f-ui); text-shadow: 0 2px 0 rgba(120,0,0,.45); z-index: 6; }

/* v2: the country in the header, the facts in the row, the weather as four tabs at the top, the views at the map's bottom left */
.htitle { flex: 1 1 auto; text-align: center; font: 900 italic 30px/1 var(--f-ui); letter-spacing: -.3px; text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.row.v2 { padding: 0 6px 0 6px; gap: 0; justify-content: flex-start; }
.row.v2 canvas { flex: 0 0 auto; width: 42px; height: 42px; margin-right: 4px; }
.row.v2 .c { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; border-left: 1px solid rgba(255,255,255,.12); }
.row.v2 .c:first-of-type { border-left: 0; }
.row.v2 .c small { font: 600 11px/1 var(--f-ui); color: var(--lbl); white-space: nowrap; } .row.v2 .c b { font: 800 italic 15px/1 var(--f-ui); white-space: nowrap; }
.row.v2 .c.best small, .row.v2 .c.best b { color: var(--gold); }
.row.v2 .opp { padding-left: 10px; }
.row.v2.v3 { padding: 0 8px; } .row.v2.v3 .c b { font-size: 14px; } .row.v2.v3 .c small { font-size: 10.5px; } .row.v2.v3 canvas { width: 36px; height: 36px; } .row.v2.v3 .c { padding: 0 2px; } .row.v2 .opp b { font-size: 21px; } .row.v2.bigopp .opp b { font-size: 30px; font-weight: 900; }
.views.bl { top: auto !important; bottom: 10px; }
.views.br { top: auto !important; bottom: 10px; left: auto !important; right: 10px; }
.views.big { gap: 6px; padding: 5px; } .views.big i { width: 40px; height: 40px; font-size: 19px; }
.views.camS i svg { width: 20px; height: 20px; } .views.camS i.on svg * { stroke: #1b1b1b; } .views.camS i.on svg .fill { fill: #1b1b1b; }
.views.cam i { width: 40px; height: 40px; } .views.cam i svg { width: 26px; height: 26px; } .views.cam i.on svg * { stroke: #1b1b1b; } .views.cam i.on svg .fill { fill: #1b1b1b; }
.wxb { position: absolute; z-index: 6; display: flex; }
.wxb i { display: flex; align-items: center; justify-content: center; gap: 6px; font: 800 italic 12px/1 var(--f-ui); font-style: normal; color: #dfe8f6; }
.wxb i em { font: 800 italic 12px/1 var(--f-ui); }
.wxb svg { width: 24px; height: 24px; flex: 0 0 auto; }
/* 1: the old group tabs */
.wxb.s1 { left: 12px; right: 12px; top: 80px; height: 40px; gap: 6px; }
.wxb.s1 i { flex: 1 1 0; border-radius: 11px; background: rgba(16,27,45,.95); border: 1px solid rgba(120,150,205,.3); }
.wxb.s1 i.on { border: 1.5px solid #3fd0ff; box-shadow: 0 0 12px rgba(63,208,255,.45), inset 0 0 10px rgba(63,208,255,.18); color: #fff; }
/* 2: chunky 3D keys, the chosen one gold */
.wxb.s2 { left: 12px; right: 12px; top: 78px; height: 40px; gap: 8px; }
.wxb.s2 i { flex: 1 1 0; border-radius: 11px; background: linear-gradient(180deg, #666d7b, #3b414d); border: 1.5px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 #1f232b; }
.wxb.s2 i.on { background: linear-gradient(180deg, #ffe07a, #ffc629 50%, #f0ad0c); border-color: #fff0b0; color: #1b1b1b; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 #9a7300; transform: translateY(2px); }
.wxb.s2 i.on svg * { fill: #1b1b1b !important; stroke: #1b1b1b !important; }
/* 3: folder tabs standing on the map's top edge */
.wxb.s3 { left: 8px; right: 8px; top: 82px; height: 42px; gap: 4px; align-items: flex-end; }
.wxb.s3 i { flex: 1 1 0; height: 36px; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, #22324f, #172338); border: 1px solid rgba(120,150,205,.3); border-bottom: 0; }
.wxb.s3 i.on { height: 42px; background: linear-gradient(180deg, #3a5a8f, #2a4167); border-color: rgba(190,215,255,.55); color: #fff; box-shadow: 0 -4px 12px rgba(63,140,255,.25); }
.wxb.s3 i.on::after { content: ''; position: absolute; }
/* 4: no buttons: the icons over the map's top, the chosen one glowing with a gold bar under it */
.wxb.s4 { left: 0; right: 0; top: 74px; height: 58px; padding: 0 30px; justify-content: space-between; background: linear-gradient(180deg, rgba(8,13,22,.85), rgba(8,13,22,0)); }
.wxb.s4 i { flex: 0 0 auto; width: 64px; flex-direction: column; gap: 4px; padding-top: 8px; opacity: .72; }
.wxb.s4 i svg { width: 28px; height: 28px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.9)); }
.wxb.s4 i.on { opacity: 1; } .wxb.s4 i.on svg { filter: drop-shadow(0 0 6px rgba(255,210,58,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.9)); }
.wxb.s4 i.on::after { content: ''; width: 30px; height: 3px; border-radius: 2px; background: #ffd23a; box-shadow: 0 0 8px rgba(255,210,58,.9); }
/* 5: one rail, a gold thumb sliding under the chosen icon (floating over the map) */
.wxb.s5 { left: 50%; transform: translateX(-50%); top: 84px; height: 44px; padding: 4px; border-radius: 999px; background: rgba(8,12,20,.82); border: 1.5px solid rgba(255,255,255,.18); box-shadow: 0 6px 16px rgba(0,0,0,.45); }
.wxb.s5 i { width: 66px; border-radius: 999px; position: relative; }
.wxb.s5 i.on { background: linear-gradient(180deg, #ffe07a, #ffc629 55%, #f0ad0c); box-shadow: 0 0 10px rgba(255,198,41,.55); }
.wxb.s5 i.on svg * { fill: #1b1b1b !important; stroke: #1b1b1b !important; }
/* 6: 3D plates tipped back in perspective, standing on the map's top edge */
.wxb.s6 { left: 10px; right: 10px; top: 76px; height: 46px; gap: 8px; perspective: 260px; }
.wxb.s6 i { flex: 1 1 0; border-radius: 10px; transform: rotateX(28deg); transform-origin: 50% 100%; background: linear-gradient(180deg, #2f4570, #1a2944); border: 1px solid rgba(160,190,255,.35); box-shadow: 0 6px 0 #0c1424, 0 10px 14px rgba(0,0,0,.5); }
.wxb.s6 i.on { background: linear-gradient(180deg, #4a7fd8, #2a56a8); border-color: #bcd6ff; box-shadow: 0 6px 0 #10264f, 0 0 16px rgba(80,150,255,.6), 0 10px 14px rgba(0,0,0,.5); color: #fff; }

/* option 4 without the gold bar: the chosen one shown by its colour and light */
.wxb.s4.k i.on::after { display: none; }
.wxb.s4.k i { opacity: 1; }
.wxb.s4.k i em { color: rgba(223,232,246,.7); }
.wxb.s4.k i.on em { color: #fff; font-weight: 900; }
.wxb.s4.k1 i:not(.on) svg { filter: grayscale(1) brightness(.8) drop-shadow(0 2px 3px rgba(0,0,0,.9)); opacity: .55; }
.wxb.s4.k1 i.on svg { filter: drop-shadow(0 0 7px rgba(255,180,40,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.8)); }
.wxb.s4.k1 i.on em { color: #ffd23a; }
.wxb.s4.k2 i:not(.on) svg { filter: grayscale(1) brightness(1.6) drop-shadow(0 2px 3px rgba(0,0,0,.9)); opacity: .7; }
.wxb.s4.k2 i.on svg { width: 38px; height: 38px; margin-top: -6px; filter: drop-shadow(0 0 10px rgba(255,255,255,.9)) drop-shadow(0 0 4px rgba(255,200,60,.9)); }
.wxb.s4.k3 i { position: relative; }
.wxb.s4.k3 i.on::before { content: ''; position: absolute; left: 50%; top: 18px; width: 74px; height: 74px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255,214,80,.6), rgba(255,170,40,.25) 55%, transparent); }
.wxb.s4.k3 i > * { position: relative; }
.wxb.s4.k3 i:not(.on) svg { filter: grayscale(1) drop-shadow(0 2px 3px rgba(0,0,0,.9)); opacity: .5; }
.wxb.s4.k3 i.on em { color: #ffe07a; }
.wxb.s4.k4 i:not(.on) svg { filter: brightness(0) drop-shadow(0 0 1px rgba(255,255,255,.5)); opacity: .55; }
.wxb.s4.k4 i:not(.on) em { color: rgba(223,232,246,.45); }
.wxb.s4.k4 i.on svg { width: 32px; height: 32px; filter: drop-shadow(0 0 9px rgba(255,170,30,1)) drop-shadow(0 0 3px rgba(255,240,180,.9)); }
.wxb.s4.k5 i:not(.on) svg { width: 22px; height: 22px; margin-top: 4px; filter: grayscale(1) brightness(1.3) drop-shadow(0 2px 3px rgba(0,0,0,.9)); opacity: .6; }
.wxb.s4.k5 i:not(.on) em { visibility: hidden; }
.wxb.s4.k5 i.on svg { width: 34px; height: 34px; transform: translateY(-3px); filter: drop-shadow(0 9px 4px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(255,190,50,.8)); }
.wxb.s4.k5 i.on em { color: #ffd23a; }
.wxb.s4.k6 { background: linear-gradient(180deg, rgba(150,90,10,.75), rgba(90,55,10,.35) 60%, rgba(8,13,22,0)); }
.wxb.s4.k6 i:not(.on) svg { filter: grayscale(1) brightness(1.4) drop-shadow(0 2px 3px rgba(0,0,0,.9)); opacity: .6; }
.wxb.s4.k6 i.on svg { filter: drop-shadow(0 0 8px rgba(255,200,60,.95)); }
.wxb.s4.k6 i.on em { color: #ffe07a; }

/* the weather as a column at the top right, opening downwards */
.wxc { position: absolute; z-index: 6; right: 10px; display: flex; flex-direction: column; align-items: center; }
.wxc i { display: flex; align-items: center; justify-content: center; font-style: normal; }
.wxc em { font: 800 italic 11px/1 var(--f-ui); color: #ffd23a; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
.wxc.c1 { gap: 8px; } .wxc.c1 i { flex-direction: column; gap: 3px; } .wxc.c1 i svg { width: 22px; height: 22px; filter: grayscale(1) brightness(1.3) drop-shadow(0 2px 3px rgba(0,0,0,.9)); opacity: .65; }
.wxc.c1.big { gap: 12px; } .wxc.c1.big i svg { width: 32px; height: 32px; } .wxc.c1.big em { font-size: 14px; }
.wxc.c1.big i.on svg { width: 54px; height: 54px; }
.wxc.c1 i.on svg { width: 36px; height: 36px; filter: drop-shadow(0 0 5px rgba(255,190,50,.8)) drop-shadow(0 3px 3px rgba(0,0,0,.6)); opacity: 1; }
.wxc.c3 { align-items: stretch; width: 128px; border-radius: 14px; background: rgba(8,12,20,.86); border: 1.5px solid rgba(255,255,255,.18); box-shadow: 0 8px 20px rgba(0,0,0,.5); overflow: hidden; }
.wxc.c3 .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255,198,41,.16); border-bottom: 1px solid rgba(255,255,255,.12); }
.wxc.c3 .head svg { width: 26px; height: 26px; } .wxc.c3 .head em { font-size: 13px; flex: 1; } .wxc.c3 .car { color: #ffd23a; font: 900 14px/1 var(--f-ui); transform: rotate(180deg); }
.wxc.c3 .list i { justify-content: flex-start; gap: 8px; padding: 7px 10px; border-top: 1px solid rgba(255,255,255,.06); } .wxc.c3 .list svg { width: 22px; height: 22px; } .wxc.c3 .list em { color: #dfe8f6; font-size: 12px; }
.wxc.c4 { gap: 6px; align-items: stretch; }
.wxc.c4 i { justify-content: flex-start; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(8,12,20,.8); border: 1px solid rgba(255,255,255,.16); }
.wxc.c4 i svg { width: 22px; height: 22px; } .wxc.c4 i em { color: #dfe8f6; font-size: 12px; }
.wxc.c4 i.on { background: linear-gradient(180deg, #ffe07a, #ffc629 55%, #f0ad0c); border-color: #fff0b0; } .wxc.c4 i.on em { color: #1b1b1b; text-shadow: none; }
.wxc.c4 i.on svg * { fill: #1b1b1b !important; stroke: #1b1b1b !important; }
.wxc.c5 { gap: 12px; } .wxc.c5 i { width: 38px; height: 38px; border-radius: 50%; position: relative; }
.wxc.c5 i svg { width: 26px; height: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.95)); }
.wxc.c5 i.on { background: radial-gradient(closest-side, rgba(255,214,80,.75), rgba(255,170,40,.3) 60%, transparent); } .wxc.c5 i.on svg { width: 30px; height: 30px; }

.wxc.c6 { position: absolute; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(8,12,20,.82); border: 1.5px solid rgba(255,255,255,.18); box-shadow: 0 6px 16px rgba(0,0,0,.45); }
.wxc.c6 .thumb { position: absolute; left: 4px; right: 4px; top: 4px; height: 40px; border-radius: 999px; background: linear-gradient(180deg, #ffe07a, #ffc629 55%, #f0ad0c); box-shadow: 0 0 10px rgba(255,198,41,.55); }

</style></head>
<body>
<div class="abs head">
  <div class="sq" id="homeBtn"><svg viewBox="0 0 24 24"><path d="M15 4.5L7.5 12l7.5 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

</div>

// the wind in 3D: streamlines in the car's own frame (x along it, the nose at +x; y up; z across, +z the side towards the camera) over a
// surface made from the car's side profile (the game's side view), lifted over it like air over a bump (a short rise before the nose, a long
// wake behind the tail), projected with the very camera the car's picture was taken with; the lines on the far side hide behind the body
async function flowLines3d(cv, img, cx, cy, cw, ch, T) {
  const F = await (await fetch(T.flow3d)).json(), C = F.cam, hw = F.info.wid / 2;
  const W = 412, top = cy - 34, H = ch + 74, s = 2; cv.width = W * s; cv.height = H * s; Object.assign(cv.style, { left: '0px', top: top + 'px', width: W + 'px', height: H + 'px' });
  const g = cv.getContext('2d'); g.scale(s, s);
  // the profile: the side view's top edge, a median (no aerial) and a smoothing
  const PX = F.prof.x, PT = F.prof.top, n = PX.length, med = PT.map((_, i) => { const a = PT.slice(Math.max(0, i - 4), i + 5).sort((p, q) => p - q); return a[a.length >> 1]; });
  const sm = med.map((_, i) => { let a = 0, w = 0; for (let d = -4; d <= 4; d++) { const v = med[i + d]; if (v == null) continue; const k = Math.exp(-d * d / 8); a += v * k; w += k; } return a / w; });
  const x0 = PX[0], dx = (PX[n - 1] - PX[0]) / (n - 1), hAt = (x) => { const f = (x - x0) / dx; if (f < 0 || f > n - 1) return 0; const i = Math.min(n - 2, Math.floor(f)); return sm[i] + (sm[i + 1] - sm[i]) * (f - i); };
  const env = (x) => { let m = 0; for (let i = 0; i < n; i += 2) { const d = x - PX[i], v = sm[i] - (d > 0 ? 0.85 * d : -0.28 * d); if (v > m) m = v; } return m; };   // (ahead of the nose x > x': a short rise; behind: a long wake)
  const fall = (z) => { const a = Math.abs(z), t = Math.min(1, Math.max(0, (a - 0.55) / 1.05)); return 1 - t * t * (3 - 2 * t); };
  // the camera
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], nrm = (a) => { const l = Math.hypot(...a); return a.map(v => v / l); }, crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const fw = nrm(sub(C.t, C.p)), rt = nrm(crs(fw, [0, 1, 0])), up = crs(rt, fw), tf = Math.tan(C.fov * Math.PI / 360), [SW, SH] = F.shot, asp = SW / SH, k = cw / (F.crop[2] - F.crop[0]);
  const proj = (P) => { const v = sub(P, C.p), zc = dot(v, fw), X = dot(v, rt) / (zc * tf * asp), Y = dot(v, up) / (zc * tf); const px = (X + 1) / 2 * SW, py = (1 - Y) / 2 * SH; return [cx + (px - F.crop[0]) * k, cy + (py - F.crop[1]) * k - top]; };
  // the car's picture: where it covers the screen
  const tc = document.createElement('canvas'); tc.width = img.naturalWidth; tc.height = img.naturalHeight; const tx = tc.getContext('2d'); tx.drawImage(img, 0, 0); const D = tx.getImageData(0, 0, tc.width, tc.height).data;
  const onCar = (q) => { const ix = Math.round((q[0] - cx) / k), iy = Math.round((q[1] + top - cy) / k); return ix >= 0 && iy >= 0 && ix < tc.width && iy < tc.height && D[(iy * tc.width + ix) * 4 + 3] > 120; };
  const L = [[1.3, .3], [1.1, .6], [.9, .9], [.7, .2], [.5, 1.12], [.3, .45], [.12, 1.32], [0, .1], [-.2, .78], [-.4, 1.5], [-.55, .35], [-.7, 1.08]];
  const cols = ['#6fe3ff', '#3fd0ff', '#5be3a8', '#3fa0ff', '#8cf0d0', '#2f7dff', '#4fc6ff', '#7af0b8', '#3d8cff', '#5fd8ff', '#2fb6ff', '#6ee6c4', '#4fb0ff', '#7fe0ff'];
  g.lineWidth = 1.7; g.lineCap = 'round'; g.lineJoin = 'round';
  L.forEach(([z, y0], j) => {
    g.strokeStyle = cols[j]; g.globalAlpha = T.flowA || 0.5; g.beginPath(); let pen = false;
    for (let x = 12; x >= -14; x -= 0.06) {
      const e = env(x) * fall(z), y = Math.sqrt(y0 * y0 + (e * 1.06 + (e > 0.01 ? 0.06 : 0)) ** 2), q = proj([x, y, z]);
      const hidden = z < -0.3 && y < hAt(x) * 1.02 && onCar(q);
      if (hidden || q[0] < -20 || q[0] > W + 20) { pen = false; continue; }

}

// the wind: lines from the right edge (the air ahead of the nose) over the body to the left edge, hugging its top; speed colours, faint
function flowLines(cv, img, cx, cy, cw, ch, T) {

// the elevation graph: the road (straightened, a fifth of its bends kept) as a wall standing on the floor, coloured by its grade
function drawGraph(cv, T) {
  const G = T.graph, W = 412, H = G.h + 34, s = 2; cv.width = W * s; cv.height = H * s; Object.assign(cv.style, { top: (G.base - H + 8) + 'px', height: H + 'px' });
  const g = cv.getContext('2d'); g.scale(s, s);
  const R = window.ROUTES[T.id], Mm = window.MENU.routeMaps[T.id] || {}, P = R.prof, n = P.length, a0 = Mm.alt[0], a1 = Mm.alt[1];
  const alt = P.map(h => a0 + (h - P[0]) * (a1 - a0) / (P[n - 1] - P[0])), lo = Math.min(...alt), hi = Math.max(...alt), step = R.len / (n - 1);
  const GR = [[0.01, [47, 191, 74]], [0.03, [154, 209, 58]], [0.05, [255, 210, 58]], [0.07, [255, 138, 42]], [0.09, [232, 52, 42]], [0.12, [158, 20, 32]]];

  const altAt = (f) => { const x = f * (n - 1), i = Math.min(n - 2, Math.floor(x)); return alt[i] + (alt[i + 1] - alt[i]) * (x - i); };
  const fmt = (a) => Math.round(a).toLocaleString('en-US') + ' m';
  const txt = (x, y, s, al, sz, c) => { g.font = '800 italic ' + (sz || 11) + 'px ApexMenu, Roboto, sans-serif'; g.textAlign = al || 'left'; g.fillStyle = c || '#fff'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 3; g.fillText(s, x, y); g.shadowBlur = 0; };
  // the route, straightened along its own start-finish line, its bends kept at a fifth, seen a little from above
  const Tp = R.top, raw = Tp.route.map(p => [p[0] * Tp.mpp, p[1] * Tp.mpp]), m = raw.length;
  const ux = raw[m - 1][0] - raw[0][0], uz = raw[m - 1][1] - raw[0][1], ul = Math.hypot(ux, uz), ex0 = ux / ul, ez0 = uz / ul, KEEP = G.keep == null ? 0.2 : G.keep;
  const pts = raw.map(p => { const dx = p[0] - raw[0][0], dz = p[1] - raw[0][1], a = dx * ex0 + dz * ez0, b = -dx * ez0 + dz * ex0; return [a, b * KEEP]; });
  const cum = [0]; for (let i = 1; i < m; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const hAt = (i) => altAt(cum[i] / cum[m - 1]), gAt = (i) => grade(Math.min(n - 2, Math.round(cum[i] / cum[m - 1] * (n - 1))));
  const pitch = 0.28, x0 = 0, x1 = pts[m - 1][0], ky = G.h / (hi - lo), kx = (W - 6) / (x1 - x0), base = H - (G.style === 'band' ? 18 : 8);
  const zs = 0.5 * Math.sin(pitch);   // the depth seen from a little above: a point further away stands higher
  const S = (p, h) => [3 + (p[0] - x0) * kx, base - (h - lo) * ky - p[1] * kx * zs];
  const Gd = pts.map(p => S(p, lo)), Tt = pts.map((p, i) => S(p, hAt(i)));
  const st = G.style;
  if (st === 'band') { const gr = g.createLinearGradient(0, base - 4, 0, H); gr.addColorStop(0, '#2a3d63'); gr.addColorStop(1, '#0d1626'); g.fillStyle = gr; g.fillRect(0, base - 2, W, H - base + 2); g.fillStyle = 'rgba(170,200,255,.7)'; g.fillRect(0, base - 2, W, 2); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, H - 3, W, 3); }
  if (st === 'glass') { g.save(); g.fillStyle = 'rgba(30,48,80,.62)'; g.strokeStyle = 'rgba(190,215,255,.45)'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(4, 2, W - 8, H - 4, 12); g.fill(); g.stroke(); g.restore(); }
  // a short hard shadow of the wall on the floor in front of it
  if (st !== 'line' && st !== 'bars') { g.save(); g.filter = 'blur(.6px)'; g.fillStyle = 'rgba(0,0,0,' + (st === 'solid' ? .35 : .25) + ')'; g.beginPath();
    Gd.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); for (let i = m - 1; i >= 0; i--) { const hh = Gd[i][1] - Tt[i][1]; g.lineTo(Gd[i][0] + hh * .08, Gd[i][1] + Math.min(6, hh * .06)); } g.closePath(); g.fill(); g.restore(); }
  if (st === 'bars') { const nb = Math.round(R.len / 250); for (let b = 0; b < nb; b++) { const f = (b + .5) / nb, i = Math.round(f * (m - 1)), x = 3 + f * (W - 6), bw = (W - 6) / nb - 2, h = (hAt(i) - lo) * ky + 3, cc = col(gAt(i));
      const gr = g.createLinearGradient(0, base - h, 0, base); gr.addColorStop(0, rgb(cc, 1.15, .95)); gr.addColorStop(1, rgb(cc, .5, .45)); g.fillStyle = gr; g.beginPath(); g.roundRect(x - bw / 2, base - h, bw, h, [2, 2, 0, 0]); g.fill(); }
    const f0b = 0.46, ib = Math.round(f0b * (m - 1)), xb = 3 + f0b * (W - 6), yb = base - (hAt(ib) - lo) * ky - 3; Tt[ib] = [xb, yb]; Tt[0] = [3, base - 3]; Tt[m - 1] = [W - 3, base - (hAt(m - 1) - lo) * ky - 3]; }
  const aTop = st === 'solid' || st === 'band' ? 1 : st === 'flat' ? .75 : st === 'line' ? .22 : .9, aBot = st === 'solid' || st === 'band' ? 1 : st === 'flat' ? .12 : st === 'line' ? 0 : .3;
  if (st !== 'bars') for (let i = 0; i < m - 1; i++) { const a = Gd[i], b = Gd[i + 1], c = Tt[i + 1], d = Tt[i], cc = col(gAt(i));
    const gr = g.createLinearGradient(0, d[1], 0, a[1]); gr.addColorStop(0, rgb(cc, st === 'solid' || st === 'band' ? 1 : 1.05, aTop)); gr.addColorStop(1, rgb(cc, st === 'solid' || st === 'band' ? .45 : .4, aBot));
    g.fillStyle = gr; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0] + .5, b[1]); g.lineTo(c[0] + .5, c[1]); g.lineTo(d[0], d[1]); g.closePath(); g.fill(); }
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (st === 'line') { g.save(); g.filter = 'blur(3px)'; g.lineWidth = 6; for (let i = 0; i < m - 1; i++) { const a = Tt[i], b = Tt[i + 1]; g.strokeStyle = rgb(col(gAt(i)), 1.2, .8); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } g.restore(); }
  g.lineWidth = st === 'line' ? 2.6 : st === 'solid' ? 2.4 : 1.8;
  if (st !== 'bars') for (let i = 0; i < m - 1; i++) { const a = Tt[i], b = Tt[i + 1]; g.strokeStyle = st === 'solid' ? 'rgba(255,255,255,.9)' : rgb(col(gAt(i)), 1.3); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  // the dot (where the map's dot is), the start's and the top's heights
  const f0 = 0.46, i0 = Math.round(f0 * (m - 1)), s0 = Tt[i0];
  g.beginPath(); g.arc(s0[0], s0[1], 8, 0, 7); g.fillStyle = 'rgba(255,210,58,.3)'; g.fill(); g.beginPath(); g.arc(s0[0], s0[1], 4, 0, 7); g.fillStyle = '#fff8d0'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#ffd23a'; g.stroke();
  g.font = '900 italic 10.5px ApexMenu, Roboto, sans-serif'; const lt = fmt(altAt(f0)), lw = g.measureText(lt).width + 12; g.fillStyle = '#ffd23a'; g.beginPath(); g.roundRect(s0[0] - lw / 2, s0[1] - 26, lw, 15, 4); g.fill(); g.fillStyle = '#2a1d00'; g.textAlign = 'center'; g.fillText(lt, s0[0], s0[1] - 15);
  const sa = Tt[0], sb = Tt[m - 1]; txt(8, Math.min(sa[1] - 7, base - 10), 'ELEVATION  ' + fmt(a0), 'left', 10); txt(W - 6, Math.max(12, sb[1] - 6), fmt(a1), 'right', 11);
}

// the globe: the Earth turned to the country, the country in gold, a point at the track
async function globe(cv, T) { if (window.GLOBE) await GLOBE.attach(cv, T); }   // (globe.js)

<script>
// the live mockup (not the game): #t=<track>&cam=<1-3>&wx=<weather>. A tap on a weather icon changes the whole screen (wxfx.js);
// the camera buttons and the neighbours' flags open another picture or track; the page is scaled to fit the window
(async () => {
  if (!window.PROGE || location.search.includes('static')) return;
  // (the choice also kept for the tab: some viewers keep only a plain #name in the address)
  let saved = ''; try { saved = sessionStorage.getItem('izbira-proge') || ''; } catch (e) {}
  const P = window.PROGE, q = new URLSearchParams(location.hash.includes('=') ? location.hash.slice(1) : saved), id = P.tracks[q.get('t')] ? q.get('t') : 'vrsic';
  const cam = [1, 2, 3].includes(+q.get('cam')) ? +q.get('cam') : 1, wx0 = WXFX.KEYS.includes(q.get('wx')) ? q.get('wx') : 'dry';
  const tr = P.tracks[id], c = tr.cams[cam], T = JSON.parse(JSON.stringify(tr.T));
  Object.assign(T, { view: cam, map: c.map, zoom: false, css: (T.css || '') + (c.css || ''), wxSel: WXFX.KEYS.indexOf(wx0) });
  await window.MOCK(T);
  const o = { flash: null, hz: T.hz, carFloor: T.carFloor, snowStyle: 'blizzard', live: true }, t0 = performance.now(), now = () => (performance.now() - t0) / 1000;
  WXFX.setTimeline([{ t: -30, k: wx0 }]); WXFX.frame(0, o);
  const fit = () => { const s = Math.min(innerWidth / 412, innerHeight / 892); document.body.style.transform = 'translateX(' + Math.max(0, (innerWidth - 412 * s) / 2) + 'px) scale(' + s + ')'; };
  document.body.style.transformOrigin = '0 0'; document.documentElement.style.width = '100%'; document.documentElement.style.height = '100%'; fit(); addEventListener('resize', fit);
  let cur = wx0;
  let gfrom = null; try { gfrom = JSON.parse(sessionStorage.getItem('izbira-globus') || 'null'); } catch (e) {}
  if (gfrom && (gfrom[0] !== T.lat || gfrom[1] !== T.lon)) GLOBE.travel(gfrom, 0.25);
  try { sessionStorage.setItem('izbira-globus', JSON.stringify([T.lat, T.lon])); } catch (e) {}
  const loop = () => { const t = now(); WXFX.frame(t); GLOBE.frame(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
  // (whole addresses: the page's <base> points at the game's folder, so a bare '#…' would lead to the game)
  const here = location.pathname + location.search, hash = (p) => { const n = new URLSearchParams({ t: id, cam, wx: cur }); for (const k in p) n.set(k, p[k]); return here + '#' + n; };
  const go = (p) => { const h = hash(p); try { sessionStorage.setItem('izbira-proge', h.split('#')[1]); } catch (e) {} history.replaceState(null, '', h); location.reload(); };
  document.querySelector('.wxc').addEventListener('click', (e) => {
    const i = e.target.closest('i'); if (!i) return;
    const k = WXFX.KEYS[[...i.parentNode.children].indexOf(i)]; if (!k || k === cur) return;
    cur = k; WXFX.tap(k, now()); const h = hash({}); try { sessionStorage.setItem('izbira-proge', h.split('#')[1]); } catch (e) {} history.replaceState(null, '', h);
  });
  document.querySelectorAll('.views i').forEach((el, i) => el.addEventListener('click', () => { if (i + 1 !== cam) go({ cam: i + 1 }); }));
  const k = P.order.indexOf(id), n = P.order.length, nb = document.querySelectorAll('.nb');
  nb[0].addEventListener('click', () => go({ t: P.order[(k - 1 + n) % n] }));
  nb[1].addEventListener('click', () => go({ t: P.order[(k + 1) % n] }));
  const toast = (m) => { const d = document.createElement('div'); d.textContent = m; d.style.cssText = 'position:absolute;left:50%;top:420px;transform:translateX(-50%);z-index:30;background:rgba(8,12,20,.9);color:#fff;font:700 15px/1.2 var(--f-ui);padding:10px 16px;border-radius:10px;white-space:nowrap'; document.body.appendChild(d); setTimeout(() => d.remove(), 1600); };
  document.querySelector('.go').addEventListener('click', () => toast('Race! (in the game the race starts)'));
  document.querySelector('#homeBtn').addEventListener('click', () => toast('Back to the main menu'));
  for (const el of [...document.querySelectorAll('.wxc, .views i, .nb, .go, #homeBtn')]) el.style.cursor = 'pointer';
})();
