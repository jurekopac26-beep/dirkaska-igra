<!doctype html><html lang="sl"><head><meta charset="utf-8">
<base href="../../"><title>Tabla in zastava</title><link rel="stylesheet" href="css/fonts.css"><style>
:root{--f-ui:'ApexMenu',Roboto,Arial,sans-serif}
html,body{margin:0;background:#16213a;font-family:var(--f-ui);color:#fff;width:800px}
h1{margin:0;padding:22px 26px 4px;font:800 30px/1.1 sans-serif;color:#ffd23a}
.sub{padding:0 26px 10px;font:500 16px/1.3 sans-serif;color:#9fb3d6}
.grid{display:grid;grid-template-columns:repeat(2,360px);gap:14px 28px;padding:10px 26px 26px}
.cell{display:flex;flex-direction:column;gap:6px}
.cell.first{grid-column:1/3;align-items:center}
.cap{font:700 15px/1.2 sans-serif;color:#e8eefb}.cap i{font-style:normal;color:#ffd23a;margin-right:6px}
.wrap{position:relative;height:150px}
.bd{position:absolute;left:0;top:52px;width:360px;height:72px;display:flex;align-items:center;justify-content:center;font:800 44px/1 var(--f-ui);overflow:hidden}
.post{position:absolute;width:7px;background:linear-gradient(90deg,#8d959e,#e6e9ec 45%,#7c848c);top:120px;height:30px}
.plate{position:absolute;top:2px;height:46px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 2.5px #fff,0 0 0 3.5px rgba(0,0,0,.4),2px 4px 0 rgba(0,0,0,.35)}
.plate img{display:block;height:100%}
.ppost{position:absolute;width:5px;top:48px;height:6px;background:#9aa2ab}
</style></head><body><h1 id="t"></h1><div class="sub" id="s"></div><div class="grid" id="g"></div>
<script src="maketa-menija/izbira-proge/wxfx.js"></script>
<script>
window.TABLE2 = async (key, name, title, sub, eu) => {
  document.getElementById('t').textContent = title; document.getElementById('s').textContent = sub;
  const V = [[null, 'Brez zastave: prava tabla te države'], ['end', 'Zastava na koncu table'], ['both', 'Zastava na obeh koncih'], ['stripe', 'Trak v barvah zastave'],
    ['plate', 'Ploščica z zastavo nad tablo'], [eu ? 'eu' : 'emblem', eu ? 'Mejna tabla EU (modra, 12 zvezd)' : 'Zastava v krogu, kot grb'], ['bg', 'Cela tabla v barvah zastave']];
  const g = document.getElementById('g'); g.innerHTML = '';
  for (const [i, [fk, cap]] of V.entries()) {
    const c = document.createElement('div'); c.className = 'cell' + (i ? '' : ' first');
    c.innerHTML = '<div class="cap"><i>' + (i ? i : '★') + '</i>' + cap + '</div><div class="wrap" style="width:360px"><i class="post" style="left:70px"></i><i class="post" style="left:283px"></i><div class="bd">' + name + '</div></div>';
    g.appendChild(c);
    const el = c.querySelector('.bd');
    await WXFX.signLook(el, key, { flag: fk === 'plate' ? null : fk, append: true, name });
    if (fk === 'plate') {   // a flag plate of its own, on two short arms over the sign
      const img = new Image(); img.src = 'assets/flags/' + key.toLowerCase().replace(/ /g, '-') + '.svg'; await img.decode();
      const h = 46, w = h * img.naturalWidth / img.naturalHeight, x = (360 - w) / 2, wr = c.querySelector('.wrap');
      wr.insertAdjacentHTML('beforeend', '<i class="ppost" style="left:' + (x + w * 0.25) + 'px"></i><i class="ppost" style="left:' + (x + w * 0.75 - 5) + 'px"></i><div class="plate" style="left:' + x + 'px;width:' + w + 'px"></div>');
      wr.querySelector('.plate').appendChild(img); img.style.width = '100%';
    }
  }
  return true;
};
</script></body></html>
