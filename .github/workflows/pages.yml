name: Objava igre (GitHub Pages)

# Objavi igro na GitHub Pages ob vsakem pushu na main.
# Povezava: https://jurekopac26-beep.github.io/dirkaska-igra/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Naenkrat teče samo ena objava; nove potisnejo staro iz vrste.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vklopi GitHub Pages (vir: GitHub Actions), če še ni vklopljen.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Samo datoteke, ki jih igra potrebuje za tek v brskalniku
      # (brez testov, orodij in razvojnih datotek).
      - name: Pripravi vsebino
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
