# Samodejni testi ob vsakem pull requestu in ob vsaki spremembi veje main (glej tests/README.md).
name: Testi
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  node:
    name: Fizika, AI in dirke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:node

  browser:
    name: Igra v brskalniku
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
