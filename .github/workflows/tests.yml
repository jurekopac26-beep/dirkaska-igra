# Samodejni testi ob vsakem pull requestu in ob vsaki spremembi veje main (glej tests/README.md).
# Osnutek (draft) pull requesta težkih poslov ne požene: tečejo, ko ga označiš »Ready for review«, in ob vsakem nadaljnjem
# potisku (odločitev uporabnika 31. 10. 2026: manj čakanja v vrsti, GitHub hkrati izvaja le ~20 poslov).
name: Testi
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# nov zagon na isti veji prekine starega (ki bi preverjal staro stanje)
concurrency:
  group: testi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ali pull request spremeni samo datoteke .md (odločitev uporabnika 3. 11. 2026, zetoni-3, točka 2; docs/varcevanje.md): takrat
  # tečejo samo testi dokumentov (fleet.test.js preveri vse .md za imena znamk avtomobilov), težki posli se preskočijo (preskočen posel
  # šteje kot uspešen). Potiski na main in ročni zagoni tečejo vedno v celoti.
  spremembe:
    name: Spremembe
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      samo_md: ${{ steps.d.outputs.samo_md }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        run: |
          samo_md=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -qv '\.md$'; then samo_md=true; fi
          fi
          echo "samo .md: $samo_md"
          echo "samo_md=$samo_md" >> "$GITHUB_OUTPUT"

  docs:
    name: Samo dokumenti
    needs: spremembe
    if: ${{ needs.spremembe.outputs.samo_md == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/fleet.test.js
  node:
    name: Fizika, AI in dirke
    needs: spremembe
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) && needs.spremembe.outputs.samo_md != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # (nabor traja na CI ~20 min: omejitev mora imeti rezervo)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:node

  # Brskalniški testi na štirih strojih hkrati: tests/run.js --shard k/4 razdeli teste po tem, koliko časa traja vsak (SECS v
  # tests/run.js, časi iz teka 29. 10. 2026: ~64 min na del). Celoten nabor na enem stroju bi trajal ~4 h in se z vsako novo progo podaljša.
  browser:
    name: Igra v brskalniku (${{ matrix.shard }}/4)
    needs: spremembe
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) && needs.spremembe.outputs.samo_md != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # (en del ~64 min; več kot omejitev testa memory (3 × 30 min) in ostalih testov v njegovem delu, da se tudi obstali test konča s povzetkom)
    strategy:
      fail-fast: false   # (vsak del do konca: napaka v enem ne ustavi drugih)
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --shard ${{ matrix.shard }}/4
        env:
          TEST_TIMEOUT_MIN: 30   # (omejitev enega testa; privzeto 15 min, smoke in memory gresta čez vse proge)
          TEST_SLOW: 2   # (ali dvakratni čas testa iz SECS, če je daljši; privzeto 4 za počasnejši stroj oblačne seje)

  # en rezultat za vse štiri dele, pod istim imenom kot prej (zelen samo, ko so zeleni vsi deli)
  browser-all:
    name: Igra v brskalniku
    needs: [spremembe, browser]
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "deli brskalniških testov: ${{ needs.browser.result }} (samo .md: ${{ needs.spremembe.outputs.samo_md }})"
          test "${{ needs.browser.result }}" = success || test "${{ needs.spremembe.outputs.samo_md }}" = true

  fleet:
    name: Vozila
    needs: spremembe
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) && needs.spremembe.outputs.samo_md != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # (nabor traja na CI 11–28 min, odvisno od stroja; pri 30 min ga je počasen stroj prekinil tik pred koncem)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fleet
