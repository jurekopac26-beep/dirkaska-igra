# Samodejni testi ob vsakem pull requestu in ob vsaki spremembi veje main (glej tests/README.md).
name: Testi
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# nov zagon na isti veji prekine starega (ki bi preverjal staro stanje)
concurrency:
  group: testi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Fizika, AI in dirke
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # (nabor traja na CI ~20 min: omejitev mora imeti rezervo)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:node

  # Brskalniški testi na štirih strojih hkrati: tests/run.js --shard k/4 razdeli teste po tem, koliko časa traja vsak (SECS v
  # tests/run.js, časi iz teka 29. 10. 2026: ~64 min na del). Celoten nabor na enem stroju bi trajal ~4 h in se z vsako novo progo podaljša.
  browser:
    name: Igra v brskalniku (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # (en del ~64 min; več kot omejitev testa memory (3 × 30 min) in ostalih testov v njegovem delu, da se tudi obstali test konča s povzetkom)
    strategy:
      fail-fast: false   # (vsak del do konca: napaka v enem ne ustavi drugih)
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --shard ${{ matrix.shard }}/4
        env:
          TEST_TIMEOUT_MIN: 30   # (omejitev enega testa; privzeto 15 min, smoke in memory gresta čez vse proge)
          TEST_SLOW: 2   # (ali dvakratni čas testa iz SECS, če je daljši; privzeto 4 za počasnejši stroj oblačne seje)

  # en rezultat za vse štiri dele, pod istim imenom kot prej (zelen samo, ko so zeleni vsi deli)
  browser-all:
    name: Igra v brskalniku
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "deli brskalniških testov: ${{ needs.browser.result }}"
          test "${{ needs.browser.result }}" = success

  fleet:
    name: Vozila
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # (nabor traja na CI 11–28 min, odvisno od stroja; pri 30 min ga je počasen stroj prekinil tik pred koncem)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fleet
