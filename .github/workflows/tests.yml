# Samodejni testi ob vsakem pull requestu in ob vsaki spremembi veje main (glej tests/README.md).
name: Testi
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# nov zagon na isti veji prekine starega (ki bi preverjal staro stanje)
concurrency:
  group: testi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Fizika, AI in dirke
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # (nabor traja na CI ~20 min: omejitev mora imeti rezervo)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:node

  browser:
    name: Igra v brskalniku
    runs-on: ubuntu-24.04
    timeout-minutes: 200   # (smoke, memory, perf in vsi, ki gredo čez vse proge, se z vsako novo progo podaljšajo za ~1,5-2 min; oktobra 2026 je nabor trajal že ~145 min)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_TIMEOUT_MIN: 30   # (omejitev enega testa; privzeto 15 min, smoke in memory gresta čez vse proge)

  fleet:
    name: Vozila
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fleet
