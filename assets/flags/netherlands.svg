<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Netherlands</title>
  <!-- Ratio 2:3. Three equal horizontal bands: red (#AE1C28), white, blue (#21468B). -->
