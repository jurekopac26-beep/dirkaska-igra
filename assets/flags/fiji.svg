<path d="M978,248Q950,230 930,250Q955,236 978,252Z"/>
<path d="M978,248Q1006,228 1026,248Q1000,236 978,252Z"/>
<path d="M978,248Q960,215 940,222Q962,222 976,250Z"/>
<path d="M978,248Q996,214 1018,222Q996,222 980,250Z"/>
