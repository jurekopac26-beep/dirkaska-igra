<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<title>New Zealand</title>
<!-- Ratio 1:2 (New Zealand Flag Act 1981): royal blue with the Union Flag in the upper hoist quarter and the Southern Cross on the fly,
     four five-pointed red stars with white borders: Gamma Crucis and Alpha Crucis on the fly's centre line, a fifth and four fifths
     down, Beta Crucis and Delta Crucis either side, the stars' sizes as the specification gives them (Alpha the largest, Delta the smallest).
     Colours: royal blue #012169 (Pantone 280), red #C8102E (Pantone 186), white. -->
