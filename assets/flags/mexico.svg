<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <title>Mexico</title>
  <!-- Ratio 4:7. Three vertical bands green, white, red of equal width; simplified for the menu's small flag, without the coat of arms.
       Colours: green #006847, white #FFFFFF, red #CE1126. -->
  <rect width="700" height="400" fill="#FFFFFF"/>
  <rect width="233.34" height="400" fill="#006847"/>
  <rect x="466.66" width="233.34" height="400" fill="#CE1126"/>
</svg>
