    <path fill="#ED1C24" d="M-111.58 -167.05 L-101.62 -20.06 A146.95 146.95 0 0 0 0 109.89 A146.95 146.95 0 0 0 101.62 -20.06 L111.58 -167.05 A280.22 280.22 0 0 1 120 -163.228 L110.26 -19.478 A155.61 155.61 0 0 1 0 118.972 A155.61 155.61 0 0 1 -110.26 -19.478 L-120 -163.228 A280.22 280.22 0 0 1 -111.58 -167.05 Z"/>
