    <path fill="#FFDD00" d="M0 -131.25 L2.25 -123.897 L9.743 -125.625 L4.5 -120 L9.743 -114.375 L2.25 -116.103 L0 -108.75 L-2.25 -116.103 L-9.743 -114.375 L-4.5 -120 L-9.743 -125.625 L-2.25 -123.897 Z"/>
