    <path fill="#005DA4" d="M-85.981 32.321 A30 30 0 0 0 -45 43.302 A30 30 0 0 1 -15 43.302 A30 30 0 0 0 15 43.302 A30 30 0 0 1 45 43.302 A30 30 0 0 0 85.981 32.321 L85.981 40.981 A30 30 0 0 1 45 51.962 A30 30 0 0 0 15 51.962 A30 30 0 0 1 -15 51.962 A30 30 0 0 0 -45 51.962 A30 30 0 0 1 -85.981 40.981 Z"/>
    <!-- three gold six-pointed stars in an inverted triangle (outer r 11.25, inner r 4.5) -->
    <path fill="#FFDD00" d="M-33.75 -176.25 L-31.5 -168.897 L-24.007 -170.625 L-29.25 -165 L-24.007 -159.375 L-31.5 -161.103 L-33.75 -153.75 L-36 -161.103 L-43.493 -159.375 L-38.25 -165 L-43.493 -170.625 L-36 -168.897 Z"/>
