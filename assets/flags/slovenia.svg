<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <title>Slovenia</title>
  <!-- Ratio 1:2. Horizontal thirds white, blue, red. Coat of arms (shield height H/3) centred on the white/blue boundary, centre at L/4 from the hoist.
       Shield drawn in its construction frame: width 240, origin at the foot of Triglav. -->
  <rect width="1200" height="200" y="0" fill="#FFFFFF"/>
  <rect width="1200" height="200" y="200" fill="#005DA4"/>
  <rect width="1200" height="200" y="400" fill="#ED1C24"/>
  <g transform="translate(300 223.044) scale(0.64684)">
    <!-- blue field: top arc r 280.22 (centre 0,90), sides converging, ogival foot of two arcs r 155.61 (centres -+45,-30) -->
    <path fill="#005DA4" d="M110.26 -19.478 L120 -163.228 A280.22 280.22 0 0 0 -120 -163.228 L-110.26 -19.478 A155.61 155.61 0 0 0 0 118.972 A155.61 155.61 0 0 0 110.26 -19.478 Z"/>
    <!-- Triglav: three peaks (0,-90), (+-45,-60), saddles (+-27,-36), foot +-90 on y=0; white base arcs r 138.29 concentric with the shield foot -->
    <path fill="#FFFFFF" d="M-90 0 A138.29 138.29 0 0 0 0 100.77 A138.29 138.29 0 0 0 90 0 L45 -60 L27 -36 L0 -90 L-27 -36 L-45 -60 Z"/>
    <!-- two wavy blue lines (sea and rivers): arcs r 30, band 8.66, second one 17.32 lower -->
