<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Czechia</title>
  <!-- Ratio 2:3. A white band over a red one, a blue triangle from the hoist reaching half the flag's length (its tip in the middle).
       Red: Pantone 485 C (#D7141A), blue: Pantone 287 C (#11457E). -->
  <rect width="900" height="600" fill="#D7141A"/>
  <rect width="900" height="300" fill="#FFFFFF"/>
  <path d="M0 0 L450 300 L0 600 Z" fill="#11457E"/>
</svg>
