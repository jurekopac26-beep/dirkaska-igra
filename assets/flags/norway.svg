<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800">
  <title>Norway</title>
  <!-- Ratio 16:22 (Flag Act 1898). Blue Nordic cross edged in white on red.
       Horizontal units 6 + 1 + 2 + 1 + 12 = 22, vertical units 6 + 1 + 2 + 1 + 6 = 16 (1 unit = 50).
       Red: PMS 200 C, blue: PMS 281 C. -->
  <rect width="1100" height="800" fill="#BA0C2F"/>
  <rect x="300" y="0" width="200" height="800" fill="#FFFFFF"/>
  <rect x="0" y="300" width="1100" height="200" fill="#FFFFFF"/>
  <rect x="350" y="0" width="100" height="800" fill="#00205B"/>
  <rect x="0" y="350" width="1100" height="100" fill="#00205B"/>
</svg>
