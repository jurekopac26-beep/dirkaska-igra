<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Russia</title>
  <!-- Ratio 2:3 (Federal Constitutional Law on the State Flag, 2000). Three equal horizontal bands:
       white, blue, red (200 px each). Colours: white #FFFFFF, blue #0039A6, red #D52B1E. -->
  <rect width="900" height="200" y="0" fill="#FFFFFF"/>
  <rect width="900" height="200" y="200" fill="#0039A6"/>
  <rect width="900" height="200" y="400" fill="#D52B1E"/>
</svg>
