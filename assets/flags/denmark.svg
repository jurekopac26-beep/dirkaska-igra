<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 280" width="370" height="280">
  <title>Denmark</title>
  <!-- Ratio 28:37. White Nordic cross on red: horizontal units 12 + 4 + 21 = 37, vertical units 12 + 4 + 12 = 28 (1 unit = 10).
       Red: Pantone 186 C. -->
  <rect width="370" height="280" fill="#C8102E"/>
  <rect x="120" y="0" width="40" height="280" fill="#FFFFFF"/>
  <rect x="0" y="120" width="370" height="40" fill="#FFFFFF"/>
</svg>
