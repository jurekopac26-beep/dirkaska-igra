<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <title>Croatia</title>
  <!-- Ratio 1:2. Three equal horizontal bands red, white, blue; in the middle the red and white chequered shield (simplified: the crown of
       small shields above it left out, as the other flags' arms are simplified). -->
  <rect width="1200" height="200" y="0" fill="#FF0000"/>
  <rect width="1200" height="200" y="200" fill="#FFFFFF"/>
  <rect width="1200" height="200" y="400" fill="#171796"/>
  <defs><clipPath id="shield"><path d="M475 150h250v190c0 70-60 100-125 120-65-20-125-50-125-120z"/></clipPath></defs>
  <g clip-path="url(#shield)">
    <rect x="475" y="150" width="250" height="310" fill="#FFFFFF"/>
    <g fill="#FF0000"><rect x="475" y="150" width="50" height="50"/><rect x="575" y="150" width="50" height="50"/><rect x="675" y="150" width="50" height="50"/><rect x="525" y="200" width="50" height="50"/><rect x="625" y="200" width="50" height="50"/><rect x="475" y="250" width="50" height="50"/><rect x="575" y="250" width="50" height="50"/><rect x="675" y="250" width="50" height="50"/><rect x="525" y="300" width="50" height="50"/><rect x="625" y="300" width="50" height="50"/><rect x="475" y="350" width="50" height="50"/><rect x="575" y="350" width="50" height="50"/><rect x="675" y="350" width="50" height="50"/><rect x="525" y="400" width="50" height="60"/><rect x="625" y="400" width="50" height="60"/></g>
  </g>
  <path d="M475 150h250v190c0 70-60 100-125 120-65-20-125-50-125-120z" fill="none" stroke="#FF0000" stroke-width="6"/>
</svg>
