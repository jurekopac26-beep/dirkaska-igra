<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <title>Liechtenstein</title>
  <!-- Ratio 3:5. Horizontal halves blue and red (Law of 30 June 1982 on the national symbols); the gold crown in the blue half near the hoist,
       drawn simplified for the menu's small size (the arch, the band with its pearls and the orb on top, outlined in black).
       Colours: blue #002B7F, red #CE1126, gold #FFD83D. -->
  <rect width="1000" height="300" y="0" fill="#002B7F"/>
  <rect width="1000" height="300" y="300" fill="#CE1126"/>
  <g fill="#FFD83D" stroke="#000000" stroke-width="5" stroke-linejoin="round">
    <path d="M150 210 L140 140 C150 90 190 80 210 110 C222 80 248 74 250 74 C252 74 278 80 290 110 C310 80 350 90 360 140 L350 210 Z"/>
    <rect x="145" y="205" width="210" height="30" rx="6"/>
    <circle cx="250" cy="58" r="16"/>
    <path d="M250 22 L250 42 M240 32 L260 32" fill="none"/>
  </g>
  <g fill="#000000">
    <circle cx="185" cy="220" r="5"/><circle cx="218" cy="220" r="5"/><circle cx="250" cy="220" r="5"/><circle cx="282" cy="220" r="5"/><circle cx="315" cy="220" r="5"/>
  </g>
</svg>
