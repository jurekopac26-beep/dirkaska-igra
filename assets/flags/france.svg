<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>France</title>
  <!-- Ratio 2:3. Three equal vertical bands blue, white, red (Constitution, art. 2).
       Colours: Bleu France #000091 and Rouge Marianne #E1000F (French State brand / DSFR). -->
  <rect x="0" y="0" width="300" height="600" fill="#000091"/>
  <rect x="300" y="0" width="300" height="600" fill="#FFFFFF"/>
  <rect x="600" y="0" width="300" height="600" fill="#E1000F"/>
</svg>
