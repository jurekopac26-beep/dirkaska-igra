<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Thailand</title>
  <!-- Ratio 2:3 (Flag Act B.E. 2522 / 1979). Five horizontal bands red, white, blue, white, red
       in heights 1:1:2:1:1 (100, 100, 200, 100, 100 of 600).
       Colours: red #A51931, white #F4F5F8, blue #2D2A4A. -->
  <rect width="900" height="600" fill="#A51931"/>
  <rect y="100" width="900" height="400" fill="#F4F5F8"/>
  <rect y="200" width="900" height="200" fill="#2D2A4A"/>
</svg>
