  <!-- Ratio 1:2 (stripes of 100). Fourteen stripes, red and white in turn from the top; the blue canton over the upper eight and half the
       length; in it, in its height C = 800, the yellow crescent between the circle of 3/8 C round 0.41 of the canton's length from the hoist
       and the circle of 1/3 C 0.084 C further to the fly (its horns at 0.54 of the length), and the star of fourteen points, 5/16 C out and
       1/8 C in, round 0.625 of the length, a point up. Red #CC0001, white, blue #010066, yellow #FFCC00. -->
  <rect width="2800" height="1400" fill="#FFFFFF"/>
  <rect y="0" width="2800" height="100" fill="#CC0001"/>
