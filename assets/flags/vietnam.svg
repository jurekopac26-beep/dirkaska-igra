       its points one fifth of the flag's length (180 of 900) from the centre, one point up.
       Colours: red #DA251D, yellow #FFFF00. -->
  <rect width="900" height="600" fill="#DA251D"/>
  <polygon points="450.0,120.0 490.4,244.4 621.2,244.4 515.4,321.2 555.8,445.6 450.0,368.8 344.2,445.6 384.6,321.2 278.8,244.4 409.6,244.4" fill="#FFFF00"/>
</svg>
