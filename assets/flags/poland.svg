<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Poland</title>
  <!-- Ratio 5:8. A white band over a red one, equal heights. Red: #DC143C (the official crimson). -->
  <rect width="800" height="500" fill="#DC143C"/>
  <rect width="800" height="250" fill="#FFFFFF"/>
</svg>
