<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <title>Oman</title>
  <!-- Ratio 1:2. Red field; a red vertical band at the hoist a quarter of the length wide; on the fly three equal horizontal
       stripes, white, red and green; the national emblem (a curved dagger in its sheath on a belt over two crossed swords)
       in white in the upper hoist, drawn here in a plain simplified form. Colours: red #DB161B, white #FFFFFF, green #008000. -->
  <rect width="1000" height="500" fill="#DB161B"/>
  <rect x="250" width="750" height="166.67" fill="#FFFFFF"/>
  <rect x="250" y="333.33" width="750" height="166.67" fill="#008000"/>
  <g fill="#FFFFFF" transform="translate(125 86)">
    <!-- the two crossed swords: curved blades, hilts and guards -->
    <g id="om-sword">
      <path d="M-58 -50 Q-20 -18 44 48 L50 44 Q-12 -22 -52 -56 Z"/>
      <rect x="-70" y="-66" width="18" height="7" transform="rotate(42 -61 -62)"/>
      <path d="M-66 -70 L-60 -76 L-50 -66 L-56 -60 Z"/>
    </g>
    <use href="#om-sword" transform="scale(-1 1)"/>
    <!-- the belt across -->
    <rect x="-38" y="-14" width="76" height="9" rx="3"/>
    <!-- the dagger: the hilt, the cap, and the curved sheath -->
    <circle cx="0" cy="-36" r="9"/>
    <rect x="-6" y="-30" width="12" height="16"/>
    <path d="M-10 -6 L10 -6 L12 14 Q14 34 30 42 Q8 44 -2 26 Q-8 14 -10 -6 Z"/>
  </g>
</svg>
