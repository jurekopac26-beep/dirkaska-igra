<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" width="750" height="650">
  <title>Belgium</title>
  <!-- Official ratio 13:15. Three equal vertical bands black, yellow (Pantone 115 C), red (Pantone 032 C). -->
  <rect width="250" height="650" x="0" fill="#000000"/>
  <rect width="250" height="650" x="250" fill="#FDDA24"/>
  <rect width="250" height="650" x="500" fill="#EF3340"/>
</svg>
